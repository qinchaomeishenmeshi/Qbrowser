[project]
name = "qw-browser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.8",
    "PyQt6==6.9.0",
    "qasync==0.27.1",
    "DrissionPage~=4.1.0.18",
    "httpx~=0.28.1",
    "ujson~=5.10.0",
    "loguru~=0.7.3",
    "requests~=2.32.3",
    "uvicorn~=0.34.2",
    "fastapi~=0.115.12",
    "pydantic~=2.11.4",
    "psutil~=6.1.0",
    "apscheduler>=3.11.0",
]

[project.optional-dependencies]
# 调度器相关依赖
scheduler = [
    "apscheduler>=3.10.4",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.10",
    "httpx>=0.25.2",
]

# 数据分析相关依赖（可选）
data-analysis = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

# 图像处理相关依赖（可选）
image-processing = [
    "pillow>=10.0.0",
]

# 开发工具依赖
dev = [
    "mypy>=1.7.1",
    "black>=23.11.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]

# 完整安装（包含所有可选依赖）
full = [
    "qw-browser[scheduler,data-analysis,image-processing,dev]",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
