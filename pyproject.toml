[project]
name = "qw-browser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp>=3.12.8",
    "aiosignal==1.3.2",
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "attrs==25.3.0",
    "certifi==2025.4.26",
    "charset-normalizer==3.4.2",
    "click==8.2.1",
    "cssselect==1.3.0",
    "datarecorder==3.6.2",
    "downloadkit==2.0.7",
    "drissionpage~=4.1.0.18",
    "et-xmlfile==2.0.0",
    "fastapi~=0.115.12",
    "filelock==3.18.0",
    "frozenlist==1.6.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx~=0.28.1",
    "idna==3.10",
    "loguru~=0.7.3",
    "lxml==5.4.0",
    "multidict==6.4.4",
    "openpyxl==3.1.5",
    "propcache==0.3.1",
    "psutil~=7.0.0",
    "pydantic~=2.11.5",
    "pydantic-core==2.33.2",
    "pyqt6==6.9.0",
    "pyqt6-qt6==6.9.1",
    "pyqt6-sip==13.10.2",
    "qasync==0.27.1",
    "requests~=2.32.3",
    "requests-file==2.1.0",
    "sniffio==1.3.1",
    "starlette==0.46.2",
    "tldextract==5.3.0",
    "typing-extensions==4.14.0",
    "typing-inspection==0.4.1",
    "ujson~=5.10.0",
    "urllib3==2.4.0",
    "uvicorn~=0.34.3",
    "websocket-client==1.8.0",
    "yarl==1.20.0",
]

[project.optional-dependencies]
# 调度器相关依赖
scheduler = [
    "apscheduler>=3.10.4",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.10",
]

# 数据分析相关依赖（可选）
data-analysis = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

# 图像处理相关依赖（可选）
image-processing = [
    "pillow>=10.0.0",
]

# 开发工具依赖
dev = [
    "mypy>=1.7.1",
    "black>=23.11.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pyinstaller>=6.0.0",
]

# 完整安装（包含所有可选依赖）
full = [
    "qw-browser[scheduler,data-analysis,image-processing,dev]",
]

[tool.uv.sources]
"tsinghua" = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.uv.scripts]
start-app = "python main.py"
start-scheduler = "python start_scheduler_server.py"

[tool.uv.dev-dependencies]
# 开发和测试工具
pytest = ">=7.4.3"
pytest-asyncio = ">=0.21.1"
mypy = ">=1.7.1"
black = ">=23.11.0"
pyinstaller = ">=6.0.0"
