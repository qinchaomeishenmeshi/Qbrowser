name: Release Tauri App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            python-build-name: 'api-server-aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            python-build-name: 'api-server-x86_64-pc-windows-msvc.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        shell: bash
        run: |
          echo "=== Installing Python dependencies ==="
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install fastapi uvicorn pydantic loguru aiohttp playwright playwright-stealth psutil aiosqlite apscheduler aiofiles python-multipart python-dateutil orjson tzlocal watchdog screeninfo httpx
          echo "=== Verifying PyInstaller installation ==="
          python -m PyInstaller --version

      - name: Build Python Backend
        shell: bash
        run: |
          set -e  # Exit on any error

          echo "=== Building Python Backend ==="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target: ${{ matrix.target }}"
          echo "Binary name: ${{ matrix.python-build-name }}"


          # Make sure the binaries directory exists
          echo "Creating binaries directory at ${{ github.workspace }}/frontend/src-tauri/binaries"
          mkdir -p ${{ github.workspace }}/frontend/src-tauri/binaries

          # Build the python executable
          echo "Running PyInstaller..."
          python -m PyInstaller --clean --noconfirm --onefile --name api-server main.py

          echo "=== PyInstaller output ==="
          ls -la dist/

          # Move and rename based on the platform
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "Moving Windows executable..."
            cp dist/api-server.exe ${{ github.workspace }}/frontend/src-tauri/binaries/${{ matrix.python-build-name }}
          else
            echo "Moving Unix executable..."
            cp dist/api-server ${{ github.workspace }}/frontend/src-tauri/binaries/${{ matrix.python-build-name }}
            chmod +x ${{ github.workspace }}/frontend/src-tauri/binaries/${{ matrix.python-build-name }}
          fi

          echo "=== Verifying binary exists ==="
          ls -la ${{ github.workspace }}/frontend/src-tauri/binaries/

          echo "=== Recursive list of src-tauri ==="
          ls -R ${{ github.workspace }}/frontend/src-tauri/

      - name: Verify Sidecar Binary
        shell: bash
        run: |
          BINARY_PATH="frontend/src-tauri/binaries/${{ matrix.python-build-name }}"
          if [ -f "$BINARY_PATH" ]; then
            echo "✅ Sidecar binary exists at: $BINARY_PATH"
            ls -la "$BINARY_PATH"
          else
            echo "❌ ERROR: Sidecar binary NOT found at: $BINARY_PATH"
            echo "Contents of frontend/src-tauri/binaries/:"
            ls -la frontend/src-tauri/binaries/ || echo "Directory does not exist"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Debug - List Binaries Before Build
        shell: bash
        run: |
          echo "=== Contents of src-tauri/binaries/ ==="
          ls -la frontend/src-tauri/binaries/
          echo "=== File details ==="
          file frontend/src-tauri/binaries/* || true

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Full App ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
