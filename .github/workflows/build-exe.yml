name: Build Windows EXE

# 添加权限配置
permissions:
  contents: write
  packages: write
  actions: read

# 触发条件
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发

jobs:
  build-windows-full:
    name: "构建完整版 (包含WebEngine)"
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    # 添加 Python 依赖缓存
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-python-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-
    
    # 添加 uv 安装缓存
    - name: Cache uv installation
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.USERPROFILE }}\.local\bin
          ${{ env.LOCALAPPDATA }}\uv
        key: ${{ runner.os }}-uv-installation-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-installation-
        
    - name: Install uv
      run: |
        $env:PYTHONIOENCODING = "utf-8"
        # 检查缓存中是否已有 uv
        $uvPath = "$env:USERPROFILE\.local\bin"
        if (Test-Path "$uvPath\uv.exe") {
          Write-Host "[OK] uv found in cache"
        } else {
          Write-Host "[INFO] Installing uv..."
          Invoke-RestMethod https://astral.sh/uv/install.ps1 | Invoke-Expression
        }
        # 刷新环境变量
        $env:PATH = "$uvPath;$env:PATH"
        # 验证安装
        if (Test-Path "$uvPath\uv.exe") {
          Write-Host "[OK] uv available at $uvPath\uv.exe"
        } else {
          Write-Host "[ERROR] uv installation failed"
          exit 1
        }
        # 添加到 PATH
        echo "$uvPath" >> $env:GITHUB_PATH
        
    - name: Verify uv installation
      run: |
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        uv --version
        
    # 添加 PyInstaller 构建缓存
    - name: Cache PyInstaller build
      uses: actions/cache@v4
      with:
        path: |
          build/
          __pycache__/
        key: ${{ runner.os }}-pyinstaller-${{ hashFiles('app.spec', '**/*.py') }}
        restore-keys: |
          ${{ runner.os }}-pyinstaller-
        
    - name: Install dependencies
      run: |
        $env:PYTHONIOENCODING = "utf-8"
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        # 使用 uv sync 安装依赖（包括 scheduler 和 dev 依赖）
        Write-Host "[INFO] Installing dependencies with uv sync..."
        uv sync --extra scheduler --extra dev
        
    - name: Create necessary directories and files
      run: |
        $env:PYTHONIOENCODING = "utf-8"
        # 创建必要的目录
        New-Item -ItemType Directory -Force -Path "data"
        New-Item -ItemType Directory -Force -Path "data\cookies"
        New-Item -ItemType Directory -Force -Path "data\user_static"
        New-Item -ItemType Directory -Force -Path "data\scheduler"
        New-Item -ItemType Directory -Force -Path "data\results"
        New-Item -ItemType Directory -Force -Path "data\tasks"
        New-Item -ItemType Directory -Force -Path "static"
        New-Item -ItemType Directory -Force -Path "logs"
        New-Item -ItemType Directory -Force -Path "templates"
        
        # 创建缓存文件
        if (-not (Test-Path "user_ids_cache.json")) {
          '{}' | Out-File -FilePath "user_ids_cache.json" -Encoding UTF8
        }
        if (-not (Test-Path "user_ports_cache.json")) {
          '{}' | Out-File -FilePath "user_ports_cache.json" -Encoding UTF8
        }
        
    - name: Test dependencies
      run: |
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        $env:PYTHONIOENCODING = "utf-8"
        Write-Host "[INFO] Testing basic dependencies..."
        uv run python test_dependencies.py
        
    - name: Test APScheduler
      run: |
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        uv run python test_apscheduler.py
        
    - name: Test All Dependencies
      run: |
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        uv run python test_dependencies.py
        
    - name: Build EXE
      run: |
        $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
        $env:PYTHONIOENCODING = "utf-8"
        Write-Host "[INFO] Starting EXE build..."
        uv run pyinstaller app.spec --clean --noconfirm --log-level DEBUG
        Write-Host "[OK] Build completed"
        
    - name: Verify build
      run: |
        $env:PYTHONIOENCODING = "utf-8"
        Write-Host "[INFO] Checking build results..."
        
        # 检查dist目录
        if (Test-Path "dist") {
          Write-Host "[OK] dist directory exists"
          Get-ChildItem "dist" -Recurse | Select-Object Name, Length, FullName
        } else {
          Write-Host "[ERROR] dist directory not found"
        }
        
        # 检查具体的EXE文件
        if (Test-Path "dist\全网直播浏览器\全网直播浏览器.exe") {
          Write-Host "[OK] EXE file built successfully"
          $exeInfo = Get-Item "dist\全网直播浏览器\全网直播浏览器.exe"
          Write-Host "EXE file size: $($exeInfo.Length) bytes"
          Write-Host "EXE file path: $($exeInfo.FullName)"
        } else {
          Write-Host "[ERROR] EXE file build failed"
          
          # 检查可能的错误日志
          if (Test-Path "build") {
            Write-Host "build目录内容:"
            Get-ChildItem "build" -Recurse | Select-Object Name, FullName
          }
          
          # 检查PyInstaller日志
          if (Test-Path "*.log") {
            Write-Host "发现日志文件:"
            Get-ChildItem "*.log" | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName -Tail 50
            }
          }
          
          exit 1
        }
        
    - name: Compress build artifacts
      run: |
        $buildDir = "dist\全网直播浏览器"
        $zipFile = "qw-browser-windows-exe-full.zip"
        
        Write-Host "[INFO] Compressing build artifacts..."
        Compress-Archive -Path "$buildDir\*" -DestinationPath $zipFile -CompressionLevel Optimal
        
        $zipSize = (Get-Item $zipFile).Length / 1MB
        Write-Host "[OK] Compressed file size: $([math]::Round($zipSize, 2)) MB"
        
    - name: Clean up build artifacts
      run: |
        Write-Host "[INFO] Cleaning up build artifacts..."
        # 删除build目录和dist目录（除了压缩包）
        if (Test-Path "build") {
          Remove-Item -Recurse -Force "build"
          Write-Host "[OK] Removed build directory"
        }
        if (Test-Path "dist") {
          Remove-Item -Recurse -Force "dist"
          Write-Host "[OK] Removed dist directory"
        }
        # 清理缓存文件
        if (Test-Path "__pycache__") {
          Remove-Item -Recurse -Force "__pycache__"
        }
        Write-Host "[OK] Cleanup completed"
        
    - name: Report storage usage
      run: |
        Write-Host "[INFO] Storage Usage Report:"
        Write-Host "Repository: ${{ github.repository }}"
        Write-Host "Workflow: ${{ github.workflow }}"
        Write-Host "Run ID: ${{ github.run_id }}"
        Write-Host "Artifact retention: 3 days"
        Write-Host "To check storage usage: https://github.com/settings/billing"
        
    - name: Upload Full Version Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qw-browser-windows-exe-full
        path: qw-browser-windows-exe-full.zip
        retention-days: 3
        
    - name: Trigger cleanup workflow
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          console.log('触发清理旧artifacts工作流...');
          try {
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cleanup-artifacts.yml',
              ref: 'main'
            });
            console.log('✅ 清理工作流已触发:', result.status);
          } catch (error) {
            console.log('⚠️  触发清理工作流失败:', error.message);
            // 忽略错误，继续执行
          }
        

        
  create-release:
    name: "创建发布版本"
    needs: [build-windows-full]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Full Version
      uses: actions/download-artifact@v4
      with:
        name: qw-browser-windows-exe-full
        path: ./full-version/
        
    - name: Create ZIP packages
      run: |
        # 创建完整版ZIP
        cd full-version
        zip -r ../qw-browser-full-${{ github.ref_name }}.zip .
        cd ..
        
        # 显示文件信息
        ls -lh *.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          qw-browser-full-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        name: "全网直播浏览器 ${{ github.ref_name }}"
        body: |
          ## 🚀 全网直播浏览器发布
          
          ### Version Information
          
          **Full Version** (`qw-browser-full-${{ github.ref_name }}.zip`)
          - [✓] Complete functionality
          - [✓] WebEngine embedded browser support
          - [✓] Scheduler management interface
          - [INFO] File size: ~150-170MB
          
          ### System Requirements
          - Windows 10/11 (64位)
          - 无需安装Python环境
          - 建议内存: 4GB+
          
          ### 🆕 更新内容
          - 修复了QtWebEngine导入错误问题
          - 优化了打包配置，减少文件大小
          - 增强了错误处理和用户体验
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  # 可选：macOS 构建（生成 .app 文件）
  build-macos:
    runs-on: macos-latest
    if: false  # 默认禁用，需要时设为 true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: |
        # 使用 uv sync 安装依赖（包括 scheduler 和 dev 依赖）
        echo "Installing dependencies with uv sync..."
        uv sync --extra scheduler --extra dev
        
    - name: Create necessary directories
      run: |
        mkdir -p data/cookies
        mkdir -p data/user_static
        mkdir -p data/scheduler
        mkdir -p data/results
        mkdir -p data/tasks
        mkdir -p static
        mkdir -p logs
        mkdir -p templates
        
        # 创建缓存文件
        if [ ! -f "user_ids_cache.json" ]; then
          echo '{}' > user_ids_cache.json
        fi
        if [ ! -f "user_ports_cache.json" ]; then
          echo '{}' > user_ports_cache.json
        fi
        
    - name: Build macOS app
      run: |
        # 修改 app.spec 为 macOS 版本
        sed -i '' 's/\.exe//g' app.spec
        uv run pyinstaller app.spec --clean --noconfirm
        
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v3
      with:
        name: qw-browser-macos-app
        path: dist/
        retention-days: 30