<!DOCTYPE html>
<html>
<head>
    <title>Browser Manager</title>
</head>
<body>
<h1>Browser Manager</h1>
<form method="post">
    <label for="user_ids">Enter User IDs (comma-separated):</label>
    <input type="text" id="user_ids" name="user_ids" required>
    <button type="submit">Start Browsers</button>
</form>
{% if user_ids %}
<p>Started browsers for users: {{ user_ids }}</p>
{% endif %}
</body>
</html>
