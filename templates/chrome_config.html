<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome浏览器路径配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .current-config {
            background: #e8f5e8;
            border-color: #28a745;
        }

        .config-item {
            display: flex;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
            gap: 10px;
        }

        .config-item:last-child {
            border-bottom: none;
        }

        .config-label {
            font-weight: 600;
            color: #495057;
            min-width: 100px;
            flex-shrink: 0;
        }

        .config-value {
            color: #6c757d;
            font-family: monospace;
            background: white;
            padding: 5px 10px;
            border-radius: 4px;
            flex: 1;
            margin-left: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            min-height: 1.2em;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);
        }

        .input-group {
            display: flex;
            margin-bottom: 15px;
        }

        .form-control {
            flex: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            margin-right: 10px;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .detected-browsers {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .browser-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        .browser-path {
            font-family: monospace;
            color: #495057;
            flex: 1;
            margin-right: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .alert-success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .alert-info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Chrome浏览器路径配置</h1>
            <p>管理和配置Chrome浏览器的可执行文件路径</p>
        </div>

        <div class="content">
            <!-- 消息提示区域 -->
            <div id="alertContainer"></div>

            <!-- 加载状态 -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>正在处理请求...</p>
            </div>

            <!-- 当前配置 -->
            <div class="section current-config">
                <h3>当前配置</h3>
                <div id="currentConfig">
                    <div class="config-item">
                        <span class="config-label">自定义路径:</span>
                        <span class="config-value" id="customPath">加载中...</span>
                    </div>
                    <div class="config-item">
                        <span class="config-label">有效路径:</span>
                        <span class="config-value" id="effectivePath">加载中...</span>
                    </div>
                    <div class="config-item">
                        <span class="config-label">配置文件:</span>
                        <span class="config-value" id="configFile">加载中...</span>
                    </div>
                    <div class="config-item">
                        <span class="config-label">操作系统:</span>
                        <span class="config-value" id="platform">加载中...</span>
                    </div>
                </div>
                <button class="btn" onclick="loadCurrentConfig()">刷新配置</button>
            </div>

            <!-- 检测到的浏览器 -->
            <div class="section detected-browsers">
                <h3>[INFO] 检测到的Chrome浏览器</h3>
                <div id="detectedBrowsers">
                    <p>点击下方按钮检测系统中可用的Chrome浏览器</p>
                </div>
                <button class="btn btn-warning" onclick="detectBrowsers()">[检测] 检测浏览器</button>
            </div>

            <!-- 设置自定义路径 -->
            <div class="section">
                <h3>[设置] 设置自定义路径</h3>
                <div class="input-group">
                    <input type="text" class="form-control" id="customPathInput" placeholder="请输入Chrome可执行文件的完整路径">
                    <button class="btn btn-success" onclick="setCustomPath()">[保存] 设置路径</button>
                </div>
                <button class="btn btn-danger" onclick="clearCustomPath()">[清除] 清除自定义路径</button>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = '/api/chrome-config';

        // 显示消息
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;

            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            // 3秒后自动隐藏
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // 显示/隐藏加载状态
        function setLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 加载当前配置
        async function loadCurrentConfig() {
            try {
                setLoading(true);
                const response = await fetch(`${API_BASE}/current`);
                const result = await response.json();

                if (result.success) {
                    const config = result.data;
                    document.getElementById('customPath').textContent = config.custom_path || '未设置';
                    document.getElementById('effectivePath').textContent = config.effective_path || '未找到';
                    document.getElementById('configFile').textContent = config.config_file;
                    document.getElementById('platform').textContent = config.platform;
                } else {
                    showAlert('加载配置失败: ' + result.message, 'danger');
                }
            } catch (error) {
                showAlert('加载配置失败: ' + error.message, 'danger');
            } finally {
                setLoading(false);
            }
        }

        // 检测浏览器
        async function detectBrowsers() {
            try {
                setLoading(true);
                const response = await fetch(`${API_BASE}/detect`);
                const result = await response.json();

                if (result.success) {
                    const browsers = result.data.available_paths;
                    const container = document.getElementById('detectedBrowsers');

                    if (browsers.length === 0) {
                        container.innerHTML = '<p>未检测到可用的Chrome浏览器</p>';
                    } else {
                        let html = `<p>检测到 ${browsers.length} 个可用的Chrome浏览器:</p>`;
                        browsers.forEach(path => {
                            html += `
                                <div class="browser-item">
                                    <span class="browser-path">${path}</span>
                                    <button class="btn btn-success" onclick="useDetectedPath('${path.replace(/'/g, "\\'")}')">使用此路径</button>
                                </div>
                            `;
                        });
                        container.innerHTML = html;
                    }
                    showAlert(result.message, 'success');
                } else {
                    showAlert('检测浏览器失败: ' + result.message, 'danger');
                }
            } catch (error) {
                showAlert('检测浏览器失败: ' + error.message, 'danger');
            } finally {
                setLoading(false);
            }
        }

        // 使用检测到的路径
        async function useDetectedPath(path) {
            document.getElementById('customPathInput').value = path;
            await setCustomPath();
        }

        // 设置自定义路径
        async function setCustomPath() {
            const path = document.getElementById('customPathInput').value.trim();

            if (!path) {
                showAlert('请输入Chrome路径', 'danger');
                return;
            }

            try {
                setLoading(true);
                const response = await fetch(`${API_BASE}/set-path`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ path: path })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    document.getElementById('customPathInput').value = '';
                    await loadCurrentConfig();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('设置路径失败: ' + error.message, 'danger');
            } finally {
                setLoading(false);
            }
        }

        // 清除自定义路径
        async function clearCustomPath() {
            if (!confirm('确定要清除自定义Chrome路径吗？')) {
                return;
            }

            try {
                setLoading(true);
                const response = await fetch(`${API_BASE}/clear-path`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    await loadCurrentConfig();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                showAlert('清除路径失败: ' + error.message, 'danger');
            } finally {
                setLoading(false);
            }
        }

        // 页面加载时自动加载当前配置
        document.addEventListener('DOMContentLoaded', function () {
            loadCurrentConfig();
        });
    </script>
</body>

</html>
