<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全网直播浏览器</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:6001 ws://localhost:3000;">
  <style>
    /* 基础样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 加载动画 */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .loading-subtitle {
      font-size: 14px;
      opacity: 0.8;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 加载页面 -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">全网直播浏览器</div>
      <div class="loading-subtitle">正在启动应用...</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

  <script>
    // 检查Electron环境
    if (typeof window.electronAPI !== 'undefined') {
      console.log('运行在Electron环境中');

      // 检查后端状态
      window.electronAPI.getBackendStatus().then(status => {
        console.log('后端状态:', status);
        if (!status.isRunning) {
          console.warn('Python后端未运行，某些功能可能不可用');
        }
      }).catch(error => {
        console.error('获取后端状态失败:', error);
      });
    } else {
      console.log('运行在浏览器环境中');
    }

    // 全局错误处理
    window.addEventListener('error', (event) => {
      console.error('全局错误:', event.error);
      if (window.electronAPI && window.electronAPI.log) {
        window.electronAPI.log.error(`全局错误: ${event.error.message}`);
      }
    });

    // 未处理的Promise拒绝
    window.addEventListener('unhandledrejection', (event) => {
      console.error('未处理的Promise拒绝:', event.reason);
      if (window.electronAPI && window.electronAPI.log) {
        window.electronAPI.log.error(`未处理的Promise拒绝: ${event.reason}`);
      }
    });
  </script>
</body>

</html>
