<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<head>
    <title>抖音直播评论常用词列表 v2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
    <!-- 标签页切换按钮 -->
    <div class="tab-buttons">
        <button id="tab-keywords" class="tab-button active">常用词</button>
        <button id="tab-comments" class="tab-button">直播评论</button>
    </div>

    <!-- 标签页内容 -->
    <div class="tab-content">
        <!-- 常用词页面 -->
        <div id="keywords-tab" class="tab active">
            <div id="word-list">
                <!-- 常用词列表 -->
            </div>
            <div class="fixed-buttons">
                <button id="add-word-button">新增常用词</button>
                <button id="random-send-button">随机发送</button>
                <button id="clear-words-button">清空记录</button>
            </div>
        </div>

        <!-- 直播评论页面 -->
        <div id="comments-tab" class="tab">
            <div>
                <h3>关键字回复规则</h3>
                <textarea id="keywords-rules-input" placeholder="每行一条规则，格式：关键字#回复内容"></textarea>

                <h3>忽略评论的昵称</h3>
                <textarea id="ignore-user-input" placeholder="设置需要忽略的评论用户昵称，多个用户换行"></textarea>

                <h3>定时发送规则</h3>
                <textarea id="time-rules-input" placeholder="设置定时发送内容，格式：1000#欢迎进入直播间"></textarea>

                <h3>直播间声音检测</h3>
                <label>
                    <input type="checkbox" id="audio-detection-toggle" />
                    开启直播间声音检测
                </label>

                <button id="save-rules-button">保存规则</button>
            </div>
        </div>
    </div>
</div>

<!-- 输入框弹窗 -->
<div id="input-modal" class="modal hidden">
    <textarea id="new-words-input" placeholder="输入多个常用词，使用换行符分割"></textarea>
    <div class="fixed-buttons">
        <button id="save-words-button">保存常用词</button>
        <button id="cancel-words-button">取消</button>
    </div>
</div>

<!-- 引入配置管理器和重构后的脚本 -->
<script src="utils/config-manager.js"></script>
<script src="popup-refactored.js"></script>
</body>
</html>
