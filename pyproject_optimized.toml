[project]
name = "qw-browser"
version = "0.1.0"
description = "QW Browser - 多浏览器实例管理工具"
readme = "README.md"
requires-python = ">=3.8"  # 降低Python版本要求以提高兼容性
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp>=3.12.8",
    "aiosignal>=1.3.0",
    "annotated-types>=0.7.0",
    "anyio>=4.9.0",
    "attrs>=23.0.0",
    "certifi>=2024.0.0",
    "charset-normalizer>=3.0.0",
    "click>=8.0.0",
    "cssselect>=1.2.0",
    "datarecorder>=3.6.0",
    "downloadkit>=2.0.0",
    "drissionpage>=4.1.0,<5.0.0",  # 使用范围约束而非波浪号
    "et-xmlfile>=1.1.0",
    "fastapi[all]>=0.115.0,<0.116.0",
    "filelock>=3.15.0",
    "frozenlist>=1.4.0",
    "h11>=0.14.0",
    "httpcore>=1.0.0",
    "httpx>=0.28.0,<0.29.0",
    "idna>=3.4",
    "loguru>=0.7.0,<0.8.0",
    "lxml>=4.9.0",
    "multidict>=6.0.0",
    "openpyxl>=3.1.0",
    "propcache>=0.2.0",
    "psutil>=5.9.0,<6.1.0",  # 使用更保守的版本范围，避免7.0.0的潜在问题
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-core>=2.33.0,<3.0.0",
    "pyqt6>=6.7.0,<6.10.0",  # 使用范围约束，避免最新版本的潜在问题
    "pyqt6-qt6>=6.7.0,<6.10.0",
    "pyqt6-sip>=13.8.0",
    "pyqt6-webengine>=6.7.0,<6.10.0",
    "qasync>=0.27.0",
    "requests>=2.32.0,<3.0.0",
    "requests-file>=2.0.0",
    "sniffio>=1.3.0",
    "starlette>=0.46.0,<0.47.0",
    "tldextract>=5.0.0",
    "typing-extensions>=4.12.0",
    "typing-inspection>=0.4.0",
    "ujson>=5.10.0,<6.0.0",
    "urllib3>=2.0.0,<3.0.0",
    "uvicorn>=0.34.0,<0.35.0",
    "websocket-client>=1.8.0",
    "yarl>=1.20.0",
    "apscheduler>=3.10.4",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2",
    "orjson>=3.9.10",
    "tzlocal>=5.0.1",
]

[project.optional-dependencies]
# 调度器相关依赖
scheduler = []

# 数据分析相关依赖（可选）
data-analysis = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

# 图像处理相关依赖（可选）
image-processing = [
    "pillow>=10.0.0",
]

# 测试相关依赖
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.0",
]

# 文档生成依赖
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

# 开发工具依赖
dev = [
    "mypy>=1.7.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "pyinstaller>=6.0.0",
]

# 完整安装（包含所有可选依赖）
full = [
    "qw-browser[scheduler,data-analysis,image-processing,test,docs,dev]",
]

[tool.uv.sources]
tsinghua = { url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["instance", "instance.*", "tests", "tests.*", "docs", "docs.*", "backups", "backups.*"]

# 代码质量工具配置
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["qw-browser"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]